<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Trị Hệ Thống | SocialPro.VN</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0d0f1a; --bg2: #131627; --bg3: #1a1e33; --accent: #6c63ff; 
    --accent3: #00d4aa; --text: #e8eaf6; --text2: #9fa8c7; --border: rgba(255,255,255,0.07);
    --gold: #f5c842; --red: #ff4757;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Be Vietnam Pro',sans-serif; background:var(--bg); color:var(--text); padding-bottom: 50px;}
  
  .navbar { height: 68px; background: rgba(13,15,26,0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100;}
  .nav-logo { font-size: 20px; font-weight: 900; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .nav-logo span { color: var(--accent); }
  .btn-back { padding: 8px 16px; background: rgba(255,255,255,0.1); color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .btn-back:hover { background: rgba(255,255,255,0.2); }

  .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
  .header-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; flex-wrap: wrap; gap: 15px;}
  .btn-primary { padding: 12px 24px; background: linear-gradient(135deg, #00d4aa, #00a876); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 20px rgba(0,212,170,0.3); transition: transform 0.2s; }
  .btn-primary:hover { transform: translateY(-2px); }

  .admin-grid { display: flex; flex-direction: column; gap: 20px; }
  .admin-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .admin-card h3 { color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .admin-pricing-card { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .admin-svc-box { background: var(--bg3); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .admin-svc-name { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .admin-sv-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap;}
  .admin-sv-id { font-weight: 800; color: var(--accent3); width: 50px; flex-shrink: 0; }
  .admin-sv-desc { flex: 1; font-size: 12.5px; color: var(--text2); min-width: 250px; }
  
  .admin-input-price { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(108,99,255,0.3); background: var(--bg2); color: var(--text); font-weight: bold; width: 120px; text-align: right; outline: none; transition: 0.2s;}
  .admin-input-price:focus { border-color: var(--accent); background: var(--bg); }

  #alert-msg { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #00d4aa, #00a876); color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; display: none; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  
  #auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: rgba(255,255,255,0.02); color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .user-email { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .balance-badge { background: rgba(0, 212, 170, 0.15); color: var(--accent3); padding: 4px 10px; border-radius: 6px; font-weight: 700; display: inline-block; }
  .money-input { width: 130px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 13px; outline: none;}
  .btn-sm { padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-add { background: rgba(0, 212, 170, 0.15); color: var(--accent3); border: 1px solid rgba(0, 212, 170, 0.3); }
  .btn-sub { background: rgba(255, 71, 87, 0.15); color: var(--red); border: 1px solid rgba(255, 71, 87, 0.3); padding: 8px 10px; }
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="spinner"></div>
  <h2 style="font-weight: 800;">Đang xác thực quyền Admin...</h2>
  <p id="auth-msg" style="color: var(--text2);">Vui lòng chờ trong giây lát</p>
</div>

<nav class="navbar">
  <a href="index.html" class="nav-logo">⚡ Social<span>Pro</span>.VN - ADMIN PANEL</a>
  <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại trang web</a>
</nav>

<div class="admin-container">
  <div class="header-actions">
    <div>
      <h2 style="font-size:26px; font-weight:800; color:var(--gold);"><i class="fas fa-crown"></i> Bảng Cập Nhật Giá Dịch Vụ</h2>
      <p style="color:var(--text2); font-size:14px; margin-top:5px;">Chỉnh sửa giá Tài khoản Premium & Dịch vụ SMM. Lưu lại để tự động đồng bộ lên Website.</p>
    </div>
    <button class="btn-primary" onclick="saveAdminPrices()" id="btn-save">
      <i class="fas fa-save"></i> Lưu Cập Nhật Giá
    </button>
  </div>

  <div id="admin-content" class="admin-grid">
    <div style="text-align:center; padding:50px; color:var(--text3); font-size:16px;">
      <i class="fas fa-spinner fa-spin" style="font-size:30px; margin-bottom:15px; display:block;"></i> Đang tải dữ liệu từ máy chủ...
    </div>
  </div>
</div>

<div id="alert-msg"><i class="fas fa-check-circle"></i> Đã lưu thành công!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAccwBvfUMMsrt4HHLB9EYJSKQq_nchtjA",
  authDomain: "socialpro-db-c2654.firebaseapp.com",
  projectId: "socialpro-db-c2654",
  storageBucket: "socialpro-db-c2654.firebasestorage.app",
  messagingSenderId: "821789877824",
  appId: "1:821789877824:web:99d69aa828b4609babe1a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN_EMAIL = "phanductruongson1201@gmail.com";

window.globalPlatforms = null;
window.globalProducts = null;

// Dữ liệu dự phòng Tài Khoản Premium
const DEFAULT_PRODUCTS = [
  { name: 'YouTube Premium', icon: '▶️', color: '#ff0000', desc: 'Nâng Cấp Tài Khoản Youtube Premium Chính Chủ', packages: [{ name: '1 Tháng', desc: 'Không Kèm Canva Pro', price: 37800 }, { name: '6 Tháng', desc: 'Tặng Kèm Canva Pro', price: 189000 }, { name: '12 Tháng', desc: 'Tặng Kèm Canva Pro', price: 324000 }] },
  { name: 'ChatGPT Plus', icon: '🤖', color: '#10a37f', desc: 'Tài khoản ChatGPT Plus Chính Chủ dùng GPT-4o', packages: [{ name: '1 Tháng', desc: 'Dùng Chung', price: 91800 }, { name: '1 Tháng', desc: 'Dùng Riêng', price: 162000 }, { name: '3 Tháng', desc: 'Nâng Cấp Chính Chủ', price: 513000 }] },
  { name: 'Netflix Ultra 4K', icon: '🎬', color: '#e50914', desc: 'Tài Khoản Netflix Ultra 4K Profile Riêng', packages: [{ name: '1 Tháng', desc: 'Profile Riêng + Pin Riêng', price: 125550 }, { name: '3 Tháng', desc: 'Profile Riêng + Pin Riêng', price: 337500 }] },
  { name: 'Canva Pro', icon: '🎨', color: '#00C4CC', desc: 'Nâng Cấp Tài Khoản Canva Pro Education Chính Chủ', packages: [{ name: '12 Tháng', desc: 'Canva Pro Full Tính Năng', price: 121500 }, { name: 'Vĩnh Viễn', desc: 'Canva Pro Education', price: 24300 }] },
  { name: 'Spotify Premium', icon: '🎵', color: '#1db954', desc: 'Tài Khoản Spotify Premium Giá Rẻ', packages: [{ name: '4 Tháng', desc: 'Tài Khoản Spotify Premium', price: 189000 }] }
];

// Dữ liệu dự phòng Dịch vụ SMM
const DEFAULT_PLATFORMS = {
  'facebook': {
    name: 'VN Facebook', icon: 'fab fa-facebook-f', color: '#1877f2',
    services: [
      { name:'Tăng Like Bài Viết', min: 100, servers: [ { id: 'SV1', desc: 'Tăng Like Có Chọn Cảm Xúc 🇻🇳', price: 14.99 }, { id: 'SV3', desc: 'Tăng Like Giá Siêu Rẻ 🇻🇳', price: 5.13 } ] },
      { name:'Tăng Người Theo Dõi', min: 100, servers: [ { id: 'SV1', desc: 'Tăng Người Theo Dõi Trang Cá Nhân 🇻🇳', price: 25.5 }, { id: 'SV2', desc: 'Tăng Người Theo Dõi Giá Rẻ', price: 12.0 } ] }
    ]
  },
  'tiktok': {
    name: 'VN TikTok', icon: 'fab fa-tiktok', color: '#000',
    services: [
      { name:'Tăng Lượt Xem Video', min: 1000, servers: [ { id: 'SV1', desc: 'Tăng View Siêu Tốc 🇻🇳', price: 2.0 }, { id: 'SV3', desc: 'Tăng View Giá Rẻ', price: 1.0 } ] },
      { name:'Tăng Thả Tim Video', min: 50, servers: [ { id: 'SV1', desc: 'Tim Người Dùng Bấm Tay 🇻🇳', price: 15.0 }, { id: 'SV2', desc: 'Tim Lên Ngay Giá Rẻ', price: 8.5 } ] }
    ]
  }
};

onAuthStateChanged(auth, async (user) => {
  const overlay = document.getElementById('auth-overlay');
  const msg = document.getElementById('auth-msg');
  if (user && user.email === ADMIN_EMAIL) {
    overlay.style.display = 'none';
    loadServicesData();
  } else {
    msg.textContent = "CẢNH BÁO: Khu vực cấm! Bạn không có quyền truy cập."; msg.style.color = "var(--red)";
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  }
});

async function loadServicesData() {
  try {
      const docRef = doc(db, 'settings', 'servicesData');
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
          const data = docSnap.data();
          window.globalPlatforms = data.platforms || DEFAULT_PLATFORMS;
          window.globalProducts = data.products || DEFAULT_PRODUCTS;
      } else {
          window.globalPlatforms = DEFAULT_PLATFORMS;
          window.globalProducts = DEFAULT_PRODUCTS;
          await setDoc(docRef, { platforms: DEFAULT_PLATFORMS, products: DEFAULT_PRODUCTS });
      }
      renderAdminPricingPanel();
  } catch(e) {
      document.getElementById('admin-content').innerHTML = '<div style="color:var(--red); padding:30px; text-align:center;">Lỗi kết nối Firebase: ' + e.message + '</div>';
  }
}

function renderAdminPricingPanel() {
  if(!window.globalPlatforms || !window.globalProducts) return;
  
  // 1. RENDER TÀI KHOẢN PREMIUM
  let html = '<h3 style="color:var(--gold); margin-bottom:20px; font-size:20px; padding-bottom:10px; border-bottom:1px solid var(--border);"><i class="fas fa-crown"></i> 1. Quản Lý Giá Tài Khoản Premium</h3>';
  
  window.globalProducts.forEach((prod, pIdx) => {
      html += `<div class="admin-pricing-card">
                  <h4 style="color:var(--text); margin-bottom:12px; font-size:16px;"> ${prod.name}</h4>
                  <div class="admin-svc-box">`;
      prod.packages.forEach((pkg, pkgIdx) => {
          html += `<div class="admin-sv-row">
                      <div class="admin-sv-id" style="width:auto; min-width:80px; color:var(--accent2);">${pkg.name}</div>
                      <div class="admin-sv-desc">${pkg.desc}</div>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <input type="number" step="1" value="${pkg.price}" id="price-prod-${pIdx}-${pkgIdx}" class="admin-input-price"> 
                        <span style="color:var(--text2);font-weight:bold;">đ</span>
                      </div>
                   </div>`;
      });
      html += `</div></div>`;
  });

  // 2. RENDER DỊCH VỤ SMM
  html += '<h3 style="color:var(--accent); margin-top:40px; margin-bottom:20px; font-size:20px; padding-bottom:10px; border-bottom:1px solid var(--border);"><i class="fas fa-chart-line"></i> 2. Quản Lý Giá Dịch Vụ SMM</h3>';

  for (const [pKey, plat] of Object.entries(window.globalPlatforms)) {
      html += `<div class="admin-pricing-card">
                  <h4 style="color:var(--text); margin-bottom:12px; font-size:16px;"><i class="${plat.icon}" style="color:${plat.color}"></i> ${plat.name}</h4>`;
      plat.services.forEach((svc, sIdx) => {
          html += `<div class="admin-svc-box"><div class="admin-svc-name" style="color:var(--accent3)">${svc.name}</div>`;
          svc.servers.forEach((sv, svIdx) => {
              html += `<div class="admin-sv-row">
                          <div class="admin-sv-id">${sv.id}</div>
                          <div class="admin-sv-desc">${sv.desc}</div>
                          <div style="display:flex; align-items:center; gap:8px;">
                            <input type="number" step="0.01" value="${sv.price}" id="price-smm-${pKey}-${sIdx}-${svIdx}" class="admin-input-price"> 
                            <span style="color:var(--text2);font-weight:bold;">đ</span>
                          </div>
                       </div>`;
          });
          html += `</div>`;
      });
      html += `</div>`;
  }
  document.getElementById('admin-content').innerHTML = html;
}

window.saveAdminPrices = async function() {
  const btn = document.getElementById('btn-save');
  const orig = btn.innerHTML;
  try {
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu lên mây...'; btn.disabled = true;
      
      // Lấy dữ liệu Premium
      let newProducts = JSON.parse(JSON.stringify(window.globalProducts));
      newProducts.forEach((prod, pIdx) => {
          prod.packages.forEach((pkg, pkgIdx) => {
              const input = document.getElementById(`price-prod-${pIdx}-${pkgIdx}`);
              if(input) { pkg.price = parseFloat(input.value) || pkg.price; }
          });
      });

      // Lấy dữ liệu SMM
      let newPlatforms = JSON.parse(JSON.stringify(window.globalPlatforms));
      for (const [pKey, plat] of Object.entries(newPlatforms)) {
          plat.services.forEach((svc, sIdx) => {
              svc.servers.forEach((sv, svIdx) => {
                  const input = document.getElementById(`price-smm-${pKey}-${sIdx}-${svIdx}`);
                  if(input) { sv.price = parseFloat(input.value) || sv.price; }
              });
          });
      }

      await setDoc(doc(db, 'settings', 'servicesData'), { platforms: newPlatforms, products: newProducts });
      window.globalPlatforms = newPlatforms;
      window.globalProducts = newProducts;
      
      const alertBox = document.getElementById('alert-msg');
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
      
      btn.innerHTML = orig; btn.disabled = false;
  } catch(e) {
      alert('Lỗi khi lưu: ' + e.message);
      btn.innerHTML = orig; btn.disabled = false;
  }
}
</script>
</body>
</html>
